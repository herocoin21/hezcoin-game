<!DOCTYPE html>
<html lang="ku">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HEZ COIN</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: #0c0e14;
            background-image: radial-gradient(circle at top, #1a2035 0%, #0c0e14 70%);
            color: #ffffff;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            height: 100vh;
            overflow: hidden;
        }

        /* Top Bar */
        .top-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 15px 20px;
            background: rgba(20, 24, 38, 0.6);
            backdrop-filter: blur(10px);
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
        }

        .brand-title {
            font-weight: 800;
            font-size: 16px;
            color: #f39c12;
            letter-spacing: 1px;
            text-shadow: 0 0 10px rgba(243, 156, 18, 0.4);
        }

        .lang-selector {
            display: flex;
            gap: 4px;
            background: #151824;
            padding: 3px;
            border-radius: 10px;
            border: 1px solid #2a2e45;
        }

        .lang-btn {
            background: transparent;
            border: none;
            color: #8a8fab;
            padding: 5px 8px;
            font-size: 11px;
            font-weight: bold;
            border-radius: 6px;
            cursor: pointer;
        }

        .lang-btn.active {
            background: #f39c12;
            color: #fff;
        }

        /* Balance Section */
        .balance-container {
            text-align: center;
            margin-top: 20px;
        }

        .coin-display {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
        }

        .coin-icon {
            width: 48px;
            height: 48px;
            background-image: url('https://cdn-icons-png.flaticon.com/512/217/217853.png');
            background-size: cover;
            background-position: center;
            border-radius: 50%;
            filter: drop-shadow(0 0 10px rgba(243, 156, 18, 0.8));
        }

        .balance-amount {
            font-size: 38px;
            font-weight: 800;
            color: #ffffff;
            letter-spacing: 1px;
        }

        .balance-label {
            font-size: 13px;
            color: #f39c12;
            margin-top: 4px;
            font-weight: 600;
            letter-spacing: 0.5px;
        }

        /* Character Tap Area */
        .tap-area {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            margin: 10px 0;
        }

        .character-circle {
            width: 220px;
            height: 220px;
            border-radius: 50%;
            border: 4px solid #f39c12;
            box-shadow: 0 0 30px rgba(243, 156, 18, 0.3), inset 0 0 20px rgba(0,0,0,0.5);
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: transform 0.08s ease;
            background: linear-gradient(145deg, #181c2e, #101320);
            overflow: hidden;
            position: relative;
        }

        .character-circle:active {
            transform: scale(0.93);
        }

        .character-img {
            width: 80%;
            height: 80%;
            object-fit: contain;
            filter: drop-shadow(0 5px 15px rgba(0,0,0,0.5));
        }

        /* Status & Energy */
        .status-container {
            width: 88%;
            margin: 0 auto;
            text-align: center;
        }

        .energy-info {
            display: flex;
            justify-content: space-between;
            font-size: 13px;
            margin-bottom: 8px;
            color: #b3b9c9;
            font-weight: 600;
        }

        .progress-bar {
            width: 100%;
            height: 12px;
            background: #151824;
            border-radius: 10px;
            overflow: hidden;
            border: 1px solid #282c40;
        }

        .progress-fill {
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, #f39c12, #e67e22);
            border-radius: 10px;
            transition: width 0.2s ease;
        }

        .watch-ads-btn {
            width: 100%;
            margin-top: 14px;
            padding: 14px;
            background: linear-gradient(135deg, #f39c12, #d35400);
            border: none;
            border-radius: 14px;
            color: #fff;
            font-weight: 700;
            font-size: 14px;
            cursor: pointer;
            box-shadow: 0 4px 20px rgba(243, 156, 18, 0.3);
            transition: opacity 0.2s;
        }

        .watch-ads-btn:active {
            opacity: 0.85;
        }

        /* Bottom Nav */
        .bottom-nav {
            display: flex;
            justify-content: space-around;
            align-items: center;
            background: rgba(18, 21, 33, 0.95);
            padding: 10px 0 14px 0;
            border-top: 1px solid rgba(255, 255, 255, 0.05);
        }

        .nav-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            color: #727891;
            text-decoration: none;
            font-size: 11px;
            gap: 5px;
            cursor: pointer;
            font-weight: 600;
            transition: color 0.2s;
        }

        .nav-item.active {
            color: #f39c12;
        }

        .nav-icon {
            font-size: 22px;
        }
    </style>
</head>
<body>

    <!-- Top Bar -->
    <div class="top-bar">
        <div class="brand-title">HEZ COIN</div>
        <div class="lang-selector">
            <button class="lang-btn">EN</button>
            <button class="lang-btn">عربي</button>
            <button class="lang-btn active">کوردی</button>
        </div>
    </div>

    <!-- Balance Area -->
    <div class="balance-container">
        <div class="coin-display">
            <div class="coin-icon"></div>
            <span class="balance-amount" id="coinCount">0.000002</span>
        </div>
        <div class="balance-label">کوين</div>
    </div>

    <!-- Tap Character Area -->
    <div class="tap-area">
        <div class="character-circle" id="tapButton">
            <img src="https://cdn-icons-png.flaticon.com/512/616/616408.png" alt="Hero" class="character-img" id="heroImg">
        </div>
    </div>

    <!-- Energy Section -->
    <div class="status-container">
        <div class="energy-info">
            <span>ئێنێرژیا مای:</span>
            <span id="energyText">500 / 500</span>
        </div>
        <div class="progress-bar">
            <div class="progress-fill" id="energyFill"></div>
        </div>
        <button class="watch-ads-btn" onclick="watchAd()">🎬 تەماشای ڕێکلامێ بکه (+50 ئێنێرجی)</button>
    </div>

    <!-- Bottom Nav -->
    <div class="bottom-nav">
        <div class="nav-item active">
            <span class="nav-icon">🏠</span>
            <span>سەرەکی</span>
        </div>
        <div class="nav-item" onclick="alert('Shop: بەشێ کۆگایێ پاشتر دێ چالاک بیت')">
            <span class="nav-icon">🛒</span>
            <span>Shop</span>
        </div>
        <div class="nav-item" onclick="alert('Task: بەشێ ئەرکان پاشتر دێ چالاک بیت')">
            <span class="nav-icon">📋</span>
            <span>Task</span>
        </div>
        <div class="nav-item" onclick="alert('Invite: بەشێ بانگهێشتکرنێ پاشتر دێ چالاک بیت')">
            <span class="nav-icon">👥</span>
            <span>Invite</span>
        </div>
    </div>

    <script>
        let coins = 0.000002;
        let energy = 500;
        const maxEnergy = 500;

        const tapButton = document.getElementById('tapButton');
        const coinCount = document.getElementById('coinCount');
        const energyText = document.getElementById('energyText');
        const energyFill = document.getElementById('energyFill');

        tapButton.addEventListener('click', () => {
            if (energy > 0) {
                coins += 0.000001;
                energy -= 1;
                coinCount.innerText = coins.toFixed(6);
                energyText.innerText = energy + " / " + maxEnergy;
                energyFill.style.width = (energy / maxEnergy * 100) + "%";
            } else {
                alert("ئێنێرژیا تە ب داوی هات! تەماشای ڕێکلامێ بکه بۆ زێدەکرنێ.");
            }
        });

        function watchAd() {
            energy = Math.min(maxEnergy, energy + 50);
            energyText.innerText = energy + " / " + maxEnergy;
            energyFill.style.width = (energy / maxEnergy * 100) + "%";
            alert("دەستخۆش! 50 ئێنێرژی بۆ تە زێدە بوو.");
        }
    </script>
</body>
</html>
